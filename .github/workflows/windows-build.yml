name: Windows Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm install

      - name: Build frontend (Vite)
        run: npm run build

      - name: Ensure Windows icon exists (auto-generate placeholder)
        shell: pwsh
        run: |
          $iconDir = "src-tauri/icons"
          if (!(Test-Path $iconDir)) { New-Item -ItemType Directory -Path $iconDir | Out-Null }
          $icoPath = "$iconDir/icon.ico"
          if (!(Test-Path $icoPath)) {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 256,256
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(26,26,26))
            $g.FillRectangle([System.Drawing.Brushes]::LightGray, 88,88,80,80)
            $g.Dispose()
            $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
            $fs = [IO.File]::OpenWrite($icoPath)
            $icon.Save($fs)
            $fs.Close()
          }
          Write-Host "Icon present at $icoPath"
          dir $iconDir

      - name: Build (Tauri)
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-bundles
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.zip
