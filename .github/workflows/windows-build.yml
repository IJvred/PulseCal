name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tree (debug)
        run: |
          pwd
          dir
          if (Test-Path package.json) { echo "Found package.json" } else { echo "NO package.json here" }
          if (Test-Path src-tauri/tauri.conf.json) { echo "Found tauri.conf.json" } else { echo "NO tauri.conf.json" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm install

      - name: Install Tauri CLI + React plugin
        run: npm i -D @tauri-apps/cli @vitejs/plugin-react

      - name: Build (Tauri)
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-bundles
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
