[package]
name = "pulsecal"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features=["serde"] }

[dependencies.tauri]
version = "2"
features = ["shell-open"]

[dependencies.tauri-plugin-sql]
version = "2"
features = ["sqlite"]
